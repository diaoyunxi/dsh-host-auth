# @diaoyunxi/dsh-host-auth-unrestricted — 解除 DSH 0.0.0.0 绑定限制的认证插件 bundle
#
# 本插件解除以下写死限制：
# 1. dsh-web-app: 硬编码禁止 0.0.0.0 绑定（"intentionally not supported yet for safety"）
#
# 保留原有认证逻辑：
# - HTTP Basic Auth 密码认证
# - browser-session token/cookie 认证流程

- insert:
    - id: host-auth-unrestricted
      name: '@diaoyunxi/dsh-host-auth-unrestricted'
