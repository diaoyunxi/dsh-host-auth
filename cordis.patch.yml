# @deepseek-ai/dsh-host-auth — HTTP Basic Auth + Binding Restriction Removal Cordis plugin bundle
#
# Registers the host-auth plugin into the Cordis loader tree.
# This bundle provides:
# - HTTP Basic Auth utilities (isAuthorized, sendUnauthorized)
# - Removal of 0.0.0.0 binding restriction
# - Trusted hosts configuration for authentication bypass
#
# 配置示例 (在 cordis patch 中使用):
# ```yaml
# - insert:
#     - id: host-auth
#       name: '@deepseek-ai/dsh-host-auth'
#       config:
#         trustedHosts:
#           - "mydomain.com"
#           - "*.example.com"
# ```

- insert:
    - id: host-auth
      name: '@deepseek-ai/dsh-host-auth'
